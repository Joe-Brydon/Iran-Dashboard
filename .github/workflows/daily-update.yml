name: Daily Iran War Risk Model Update

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily update headless
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/run_update.sh

      - name: Open PR with the day's update
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: daily-update-${{ github.run_id }}
          commit-message: "Daily update run ${{ github.run_id }}"
          title: "Daily update run ${{ github.run_id }}"
          body: "Automated update from the scheduled Claude Code run. Review scripts/last_run.json and the changelog entry in data/state.json before merging."
          add-paths: |
            data/state.json
            scripts/last_run.json
